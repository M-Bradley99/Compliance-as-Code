name: OPA Compliance Check

on:
  push:
  pull_request:

jobs:
  opa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA (latest static build)
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Check OPA version
        run: opa version

      - name: Evaluate insecure example (expected to fail)
        run: |
          echo "Running OPA on insecure-s3..."
          opa eval --input terraform-examples/insecure-s3/main.tf --data policies --format pretty "data.nist" || true

      - name: Evaluate secure example
        run: |
          echo "Running OPA on secure-s3..."
          opa eval --input terraform-examples/secure-s3/main.tf --data policies --format pretty "data.nist"

      - name: Generate compliance report
        run: |
          echo "Generating compliance report..."
          opa eval --input terraform-examples/insecure-s3/main.tf --data policies --format json "data.nist" > compliance-report.json

      - name: Upload compliance report artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.json
